name: terae_app
description: "Terae — app acadêmico do paciente (Dispositivos Móveis, UNEMAT 2026). Não é o app do Terae produção."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  intl: ^0.20.3
  provider: ^6.1.5+1
  # Único acréscimo ao §24 da Atividade 3: ligar para CVV 188 / SAMU 192 com um toque (TM00, TM05).
  url_launcher: ^6.3.2

  # Atividade 4 — persistência local (D16): SQLite e SharedPreferences.
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  # Atividade 4 — integração com o Firebase acadêmico (D12, D14) e o fluxo online/offline.
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  # Evolução de TO (F2, D28): lembretes só locais, no fuso da clínica. A 22
  # é a última que compila com o compileSdk 36 do Flutter 3.47 (a 23 pede 37).
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.2
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Atividade 5 — jornada principal no aparelho (integration_test/).
  integration_test:
    sdk: flutter
  # Atividade 4 — SQLite no computador (testes) e Firebase de mentira.
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/dados/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
